services:
  mongodb:
    image: mongo:7.0.24
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - inventory_mongodb:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  inventory_mongodb:
